<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Packet Drop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #111e19 0%, #1a1a1a 100%);
            color: #ffffff;
            overflow: hidden;
        }

        /* Container Structure */
        .wrapper {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            padding: 3rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Branding Section (Top Left Alignment) */
        .brand-section {
            align-self: flex-start;
        }

        .brand-name {
            font-size: 1.75rem;
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -0.5px;
            margin-bottom: 0.25rem;
        }

        .tagline {
            font-size: 0.9rem;
            font-weight: 400;
            color: #a0aec0;
            letter-spacing: 0.5px;
        }

        /* Main Context Hero (Centered Structure) */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            flex-grow: 1;
            margin-top: -4rem; /* Visual balance adjustment */
        }

        .headline {
            font-size: 3rem;
            font-weight: 600;
            margin-bottom: 2.5rem;
            letter-spacing: -0.5px;
            animation: fadeIn 1s ease-out;
        }

        .sub-heading {
            font-size: 1.15rem;
            color: #cbd5e0;
            margin-bottom: 1.5rem;
            font-weight: 400;
        }

        /* Interactive Call To Action */
        .cta-button {
            display: inline-block;
            background-color: #e2e8f0;
            color: #1a202c;
            text-decoration: none;
            padding: 0.85rem 3.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .cta-button:hover {
            background-color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 7px 14px rgba(0, 0, 0, 0.15);
        }

        .cta-button:active {
            transform: translateY(0);
        }

        /* Fade In Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive Fixes for Mobile Devices */
        @media (max-width: 768px) {
            .wrapper { padding: 2rem; }
            .headline { font-size: 2.25rem; }
            .brand-name { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="wrapper">
  
        <header class="brand-section">
            <h1 class="brand-name">The Packet<br>Drop</h1>
            <p class="tagline">Where the lost land</p>
        </header>


        <main class="main-content">
            <h2 class="headline">You shouldn't be here...</h2>
            <p class="sub-heading">View my portfolio instead</p>
      
            <a href="../portfolio.html" class="cta-button">Click here</a>
        </main>
    </div>

</body>
</html>
